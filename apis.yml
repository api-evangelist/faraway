aid: faraway
name: Faraway
description: >-
  Faraway is a web3 gaming company building an interoperable gaming ecosystem for
  players, creators, and studios. Its platform lets game studios integrate player-driven,
  blockchain-based economies into their titles across EVM-compatible chains and Solana,
  with a unified player identity and wallet (id.faraway.com), a creator platform for
  user-generated content and monetization (create.faraway.com), and an in-game marketplace
  and secondary-trading shop (shop.faraway.com). Faraway publishes a developer platform
  with an API reference and an llms.txt index at docs.faraway.com. The company is backed
  by a16z, Lightspeed Venture Partners, and Pantera Capital.
